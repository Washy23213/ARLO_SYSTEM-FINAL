<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CMU ARLO Classic PostgreSQL ERD</title>
    <style>
        @page { size: landscape; margin: 8mm; }
        body { margin: 0; background: #f3f4f6; font-family: "Segoe UI", Arial, sans-serif; color: #111827; }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #d1d5db;
        }
        h1 { margin: 0; font-size: 18px; }
        p { margin: 2px 0 0; color: #4b5563; font-size: 13px; font-weight: 700; }
        a, button {
            border: 1px solid #111827;
            background: #111827;
            color: #ffffff;
            border-radius: 4px;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 9px 14px;
            text-decoration: none;
        }
        .canvas { overflow: auto; padding: 16px; }
        img { display: block; width: 100%; min-width: 1900px; height: auto; background: #fff; border: 1px solid #d1d5db; }
        @media print {
            .toolbar { display: none; }
            .canvas { overflow: visible; padding: 0; }
            img { min-width: 0; border: 0; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div>
            <h1>CMU ARLO Classic PostgreSQL ERD</h1>
            <p>21 tables, 274 columns, 17 physical foreign keys. Classic database layout.</p>
        </div>
        <div>
            <a href="arlo-postgresql-classic-erd-landscape.svg" download>Download SVG</a>
            <button type="button" onclick="window.print()">Print Landscape</button>
        </div>
    </div>
    <main class="canvas">
        <img src="arlo-postgresql-classic-erd-landscape.svg" alt="CMU ARLO classic PostgreSQL ERD">
    </main>
</body>
</html>
