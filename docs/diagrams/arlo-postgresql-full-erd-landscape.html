<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CMU ARLO PostgreSQL ERD</title>
    <style>
        @page { size: landscape; margin: 8mm; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: #eef3ea;
            color: #062b1d;
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
        }
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid #d8e0db;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }
        .toolbar h1 {
            margin: 0;
            font-size: 18px;
        }
        .toolbar p {
            margin: 2px 0 0;
            color: #526071;
            font-size: 13px;
            font-weight: 700;
        }
        .toolbar a,
        .toolbar button {
            border: 1px solid #0f766e;
            border-radius: 999px;
            background: #065f46;
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-weight: 800;
            padding: 10px 16px;
            text-decoration: none;
        }
        .canvas {
            padding: 18px;
            overflow: auto;
        }
        img {
            display: block;
            width: 100%;
            min-width: 1800px;
            height: auto;
            border: 1px solid #d8e0db;
            border-radius: 18px;
            background: #fff;
        }
        @media print {
            .toolbar { display: none; }
            .canvas { padding: 0; overflow: visible; }
            img { width: 100%; min-width: 0; border: 0; border-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <div>
            <h1>CMU ARLO PostgreSQL Database ERD</h1>
            <p>21 tables, 274 columns, 17 physical foreign keys. Use browser zoom for adviser review.</p>
        </div>
        <div>
            <a href="arlo-postgresql-full-erd-landscape.svg" download>Download SVG</a>
            <button type="button" onclick="window.print()">Print Landscape</button>
        </div>
    </div>
    <main class="canvas">
        <img src="arlo-postgresql-full-erd-landscape.svg" alt="CMU ARLO PostgreSQL full database ERD">
    </main>
</body>
</html>
